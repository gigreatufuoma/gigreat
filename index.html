<!DOCTYPE html>
<html>
  <head>
    <title>Eshareturi Gigreat Ufuoma - Portfolio</title>
    <style>
      body {
        background-color: #f9f9f9;
        font-family: sans-serif;
        text-align: center;
        padding: 30px;
        color: #333333;
        transition: background-color 0.3s, color 0.3s;
      }
      
      .card {
        background-color: white;
        max-width: 400px;
        margin: 20px auto;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        transition: background-color 0.3s, box-shadow 0.3s;
      }

      .profile-img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 15px;
        border: 3px solid #2980b9;
      }

      h1 { color: #2c3e50; margin-bottom: 5px; }
      .subtitle { color: #e67e22; font-weight: bold; margin-bottom: 20px; }
      p { line-height: 1.6; color: #555555; }

      ul {
        list-style-type: none;
        padding: 0;
        margin: 20px 0;
      }

      li {
        background-color: #ecf0f1;
        margin: 5px 0;
        padding: 8px;
        border-radius: 5px;
      }

      /* Calculator styles inside single page */
      .calc-display {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        margin-bottom: 10px;
        box-sizing: border-box;
        text-align: right;
        border: 2px solid #ddd;
        border-radius: 5px;
      }
      .calc-buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 15px;
      }
      .calc-buttons button {
        padding: 10px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        border: none;
        background-color: #ecf0f1;
        border-radius: 5px;
      }

      /* To-Do styles */
      .todo-input-group { display: flex; gap: 8px; margin-bottom: 10px; }
      .todo-input-group input { flex: 1; padding: 8px; border: 2px solid #ddd; border-radius: 5px; }
      .todo-list { text-align: left; }
      .todo-list li { display: flex; justify-content: space-between; align-items: center; }

      /* Contact form styles */
      .form-group { margin-bottom: 10px; text-align: left; }
      .form-group label { display: block; margin-bottom: 3px; font-weight: bold; font-size: 13px; }
      .form-group input, .form-group textarea { width: 100%; padding: 8px; border: 2px solid #ddd; border-radius: 5px; box-sizing: border-box; }

      .main-btn {
        background-color: #2980b9;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 15px;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 10px;
        width: 100%;
        font-weight: bold;
      }

      /* Dark mode styles */
      body.dark-mode { background-color: #1a1a1a; color: #f9f9f9; }
      body.dark-mode .card { background-color: #2d2d2d; color: #f9f9f9; box-shadow: 0 4px 8px rgba(255, 255, 255, 0.1); }
      body.dark-mode h1 { color: #3498db; }
      body.dark-mode p { color: #cccccc; }
      body.dark-mode li, body.dark-mode .calc-buttons button { background-color: #3d3d3d; color: #ffffff; }
      body.dark-mode .calc-display, body.dark-mode .todo-input-group input, body.dark-mode .form-group input, body.dark-mode .form-group textarea { background-color: #3d3d3d; color: #fff; border-color: #555; }
    </style>
  </head>
  <body>

    <!-- Portfolio Section -->
    <div class="card">
      <img src="me.jpg" alt="Eshareturi Gigreat Ufuoma" class="profile-img">
      <h1>Eshareturi Gigreat Ufuoma</h1>
      <div class="subtitle">Web Developer</div>
      <p>Hello! I am Gigreat by name, graduated from Delsu Secondary School, Abraka.</p>

      <h3>My Hobbies</h3>
      <ul>
        <li>Coding & Tech</li>
        <li>Reading</li>
        <li>Listening to Music</li>
      </ul>

      <button onclick="toggleDarkMode()" style="background-color: #34495e;">Toggle Dark Mode</button>
    </div>

    <!-- Mini Calculator Section -->
    <div class="card">
      <h2>Mini Calculator</h2>
      <input type="text" id="calcDisplay" class="calc-display" readonly>
      <div class="calc-buttons">
        <button onclick="clearCalc()">C</button>
        <button onclick="appendCalc('/')">/</button>
        <button onclick="appendCalc('*')">*</button>
        <button onclick="appendCalc('-')">-</button>
        <button onclick="appendCalc('7')">7</button>
        <button onclick="appendCalc('8')">8</button>
        <button onclick="appendCalc('9')">9</button>
        <button onclick="appendCalc('+')">+</button>
        <button onclick="appendCalc('4')">4</button>
        <button onclick="appendCalc('5')">5</button>
        <button onclick="appendCalc('6')">6</button>
        <button onclick="calculateResult()" style="background-color: #27ae60; color:white;">=</button>
        <button onclick="appendCalc('1')">1</button>
        <button onclick="appendCalc('2')">2</button>
        <button onclick="appendCalc('3')">3</button>
        <button onclick="appendCalc('0')">0</button>
      </div>
    </div>

    <!-- To-Do List Section -->
    <div class="card">
      <h2>My To-Do List</h2>
      <div class="todo-input-group">
        <input type="text" id="taskInput" placeholder="Add a new task...">
        <button onclick="addTask()" style="background-color: #e67e22; color:white; border:none; border-radius:5px; cursor:pointer; padding:8px 12px;">Add</button>
      </div>
      <ul id="taskList" class="todo-list"></ul>
    </div>

    <!-- Contact Form Section -->
    <div class="card">
      <h2>Contact Me</h2>
      <form onsubmit="handleContact(event)">
        <div class="form-group">
          <label>Your Name:</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label>Your Email:</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label>Message:</label>
          <textarea id="message" rows="3" required></textarea>
        </div>
        <button type="submit" class="main-btn" style="background-color: #8e44ad;">Send Message</button>
      </form>
    </div>

    <script>
      // Persistent Theme Loader
      window.onload = function() {
        if (localStorage.getItem('theme') === 'dark') {
          document.body.classList.add('dark-mode');
        }
      };

      function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        if (document.body.classList.contains('dark-mode')) {
          localStorage.setItem('theme', 'dark');
        } else {
          localStorage.setItem('theme', 'light');
        }
      }

      // Calculator Logic
      function appendCalc(val) { document.getElementById('calcDisplay').value += val; }
      function clearCalc() { document.getElementById('calcDisplay').value = ''; }
      function calculateResult() {
        try {
          document.getElementById('calcDisplay').value = eval(document.getElementById('calcDisplay').value);
        } catch {
          document.getElementById('calcDisplay').value = 'Error';
        }
      }

      // To-Do List Logic
      function addTask() {
        let input = document.getElementById('taskInput');
        if (input.value.trim() === '') return;
        let ul = document.getElementById('taskList');
        let li = document.createElement('li');
        li.innerHTML = `${input.value} <button onclick="this.parentElement.remove()" style="background:#e74c3c; color:white; border:none; padding:3px 6px; border-radius:3px; cursor:pointer;">X</button>`;
        ul.appendChild(li);
        input.value = '';
      }

      // Contact Form Logic
      function handleContact(e) {
        e.preventDefault();
        alert('Thank you for your message! I will get back to you soon.');
        e.target.reset();
      }
    </script>
  </body>
</html>
